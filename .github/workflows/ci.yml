name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1' # weekly, for new versions of the dependencies

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            dependencies: locked
          - php: '8.5'
            dependencies: locked
          - php: '8.4'
            dependencies: lowest
          - php: '8.5'
            dependencies: highest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags for the version check of the bridge plugin

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: libxml, posix, simplexml, zip
          coverage: none
          tools: composer, cs2pr

      - name: Install the EditorConfig C core for the reference tests
        run: sudo apt-get update && sudo apt-get install --yes editorconfig

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install locked dependencies
        if: matrix.dependencies == 'locked'
        run: composer install --no-interaction --no-progress

      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --no-interaction --no-progress --prefer-lowest --prefer-stable

      - name: Install highest dependencies
        if: matrix.dependencies == 'highest'
        run: composer update --no-interaction --no-progress --prefer-stable

      - name: PHPUnit
        run: vendor/bin/phpunit --fail-on-skipped

      - name: PHPStan
        if: matrix.dependencies == 'locked'
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: PHP_CodeSniffer
        if: matrix.dependencies == 'locked'
        run: vendor/bin/phpcs -q --report=checkstyle | cs2pr
